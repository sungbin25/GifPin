name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/GifPin/GifPin.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build (warnings shown)
        run: dotnet build src/GifPin/GifPin.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/GifPin/GifPin.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Smoke test (overlay + background removal + WebP)
        shell: pwsh
        run: |
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'GifPin'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $gif = (Resolve-Path tests\sample.gif).Path
          # 샘플 GIF 하나를 라이브러리와 화면에 올린 상태로 시작
          @{
            Version = 2
            Library = @(@{ Id = 'psmoke'; Name = 'sample'; File = $gif; Width = 96; Height = 96; FrameCount = 6; FileSize = 1000; AddedAt = '2026-01-01T00:00:00+09:00' })
            Active  = @(@{ Id = 'asmoke'; PhotoId = 'psmoke'; X = 200; Y = 200; Scale = 1.5; Opacity = 1; Speed = 1; ClickThrough = $true; Visible = $true })
            Settings = @{ OpenWindowOnStart = $true }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $data 'state.json')

          $env:GIFPIN_SMOKETEST = "1"
          $env:GIFPIN_SMOKE_GIF = $gif
          $p = Start-Process -FilePath publish\GifPin.exe -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "GifPin did not exit within 90s"; exit 1 }
          $err = Join-Path $data 'smoke.err'
          if (Test-Path $err) { Get-Content $err; Write-Error "GifPin smoke test failed"; exit 1 }
          $ok = Join-Path $data 'smoke.ok'
          if (-not (Test-Path $ok)) { Write-Error "GifPin exited (code $($p.ExitCode)) without finishing startup"; exit 1 }
          Get-Content $ok
          Write-Host "Smoke test passed"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$pwd\publish" "/O$pwd\dist" installer\GifPin.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish\GifPin.exe "dist\GifPin-portable-${{ steps.ver.outputs.version }}.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: GifPin-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
