name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for this manual build'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the built installer and portable executable'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/GifPin/GifPin.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build (warnings shown)
        run: dotnet build src/GifPin/GifPin.csproj -c Release

      - name: Collision and video conversion integration tests
        if: ${{ !inputs.skip_tests }}
        run: dotnet run --project tests/GifPin.VideoTests -c Release -- --download-tools .work/video-tests

      - name: Publish single-file exe
        run: >
          dotnet publish src/GifPin/GifPin.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Publish small exe for the installer (uses the .NET 8 Desktop Runtime on the PC)
        run: >
          dotnet publish src/GifPin/GifPin.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false -p:DebugType=none -o publish-fd

      - name: Smoke test (overlay + background removal + WebP)
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'GifPin'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $gif = (Resolve-Path tests\sample.gif).Path
          # 샘플 GIF 하나를 라이브러리와 화면에 올린 상태로 시작
          @{
            Version = 2
            Library = @(@{ Id = 'psmoke'; Name = 'sample'; File = $gif; Width = 96; Height = 96; FrameCount = 6; FileSize = 1000; AddedAt = '2026-01-01T00:00:00+09:00' })
            Active  = @(@{ Id = 'asmoke'; PhotoId = 'psmoke'; X = 200; Y = 200; Scale = 1.5; Opacity = 1; Speed = 1; ClickThrough = $true; Visible = $true })
            Settings = @{ OpenWindowOnStart = $true }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $data 'state.json')

          $env:GIFPIN_SMOKETEST = "1"
          $env:GIFPIN_SMOKE_GIF = $gif
          $env:GIFPIN_SMOKE_ASSETS = (Resolve-Path tests).Path
          $p = Start-Process -FilePath publish\MotiNook.exe -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "GifPin did not exit within 90s"; exit 1 }
          $err = Join-Path $data 'smoke.err'
          if (Test-Path $err) {
            $msg = (Get-Content $err -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=Smoke test::$msg"
            $log = Join-Path $data 'logs\gifpin.log'
            if (Test-Path $log) { $tail = ((Get-Content $log -Tail 30) -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'; Write-Host "::error title=gifpin.log::$tail" }
            exit 1
          }
          $ok = Join-Path $data 'smoke.ok'
          if (-not (Test-Path $ok)) {
            Write-Host "::error title=Smoke test::GifPin exited (code $($p.ExitCode)) without finishing startup"
            $log = Join-Path $data 'logs\gifpin.log'
            if (Test-Path $log) { $tail = ((Get-Content $log -Tail 30) -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'; Write-Host "::error title=gifpin.log::$tail" }
            exit 1
          }
          Write-Host "::notice title=Smoke test::$((Get-Content $ok -Raw) -replace "`r",'' -replace "`n",' | ')"
          Get-Content $ok
          Write-Host "Smoke test passed"

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-shots
          path: ~/AppData/Roaming/GifPin/theme-shots/*.png
          if-no-files-found: ignore

      - name: Push theme screenshots to ci-shots branch (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $src = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'GifPin\theme-shots'
          if (-not (Test-Path $src)) { exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$src\*.png" $dir
          Set-Location $dir
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "theme screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-shots

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$pwd\publish-fd" "/O$pwd\dist" installer\GifPin.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish\MotiNook.exe "dist\MotiNook-portable-${{ steps.ver.outputs.version }}.exe"
          Get-ChildItem dist

      - name: Installer test (silent install, runtime check, start installed MotiNook)
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\MotiNook-Setup-*.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'gifpin-setup.log'
          # 한국어로 설치 → 설치한 GifPin이 한국어로 시작해야 함
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LANG=korean',"/LOG=$log" -PassThru -Wait
          $text = Get-Content $log -Raw
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Installer::exit code $($p.ExitCode)"; Get-Content $log -Tail 40; exit 1 }
          if ($text -notmatch 'Desktop Runtime is already installed|Runtime installer finished with code 0') { Write-Host "::error title=Installer::runtime check not in log"; Get-Content $log -Tail 40; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MotiNook\MotiNook.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error title=Installer::GifPin.exe not installed"; exit 1 }
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'GifPin'
          $applog = Join-Path $data 'logs\gifpin.log'
          $before = if (Test-Path $applog) { (Get-Content $applog).Count } else { 0 }
          $app = Start-Process -FilePath $exe -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 8
          $alive = -not $app.HasExited
          if ($alive) { Stop-Process -Id $app.Id -Force }
          $new = if (Test-Path $applog) { (Get-Content $applog | Select-Object -Skip $before) -join "`n" } else { '' }
          if (-not $alive -or $new -notmatch 'MotiNook ${{ steps.ver.outputs.version }} starting') {
            Write-Host "::error title=Installer::installed MotiNook did not start (alive=$alive)"; Write-Host $new; exit 1
          }
          $lang = (Get-Content (Join-Path $data 'state.json') -Raw | ConvertFrom-Json).Settings.Language
          if ($lang -ne 'ko') { Write-Host "::error title=Installer::installed in Korean but GifPin started in '$lang'"; exit 1 }
          # 아이콘: 바로가기는 버전 이름이 붙은 새 아이콘 파일을 쓰고, 설치된 exe에도 새 아이콘이 들어 있어야 함
          $ver = '${{ steps.ver.outputs.version }}'
          $ico = Join-Path $env:LOCALAPPDATA "Programs\MotiNook\GifPin-$ver.ico"
          if (-not (Test-Path $ico)) { Write-Host "::error title=Installer::shortcut icon file missing ($ico)"; exit 1 }
          $shell = New-Object -ComObject WScript.Shell
          $links = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'MotiNook.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'MotiNook.lnk')
          )
          foreach ($lnk in $links) {
            if (-not (Test-Path $lnk)) { Write-Host "::error title=Installer::shortcut missing ($lnk)"; exit 1 }
            $loc = $shell.CreateShortcut($lnk).IconLocation
            if ($loc -notlike "*GifPin-$ver.ico*") { Write-Host "::error title=Installer::shortcut $lnk uses icon '$loc'"; exit 1 }
          }
          # .gifpin 팩: 설치한 GifPin으로 열리고 팩 아이콘이 있어야 함
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\GifPin.Pack\shell\open\command').'(default)'
          $packIcon = (Get-ItemProperty 'HKCU:\Software\Classes\GifPin.Pack\DefaultIcon').'(default)'
          $assoc = (Get-ItemProperty 'HKCU:\Software\Classes\.gifpin').'(default)'
          if ($assoc -ne 'GifPin.Pack' -or $cmd -notlike "*$exe*" -or -not (Test-Path $packIcon)) { Write-Host "::error title=Installer::.gifpin association wrong (assoc=$assoc cmd=$cmd icon=$packIcon)"; exit 1 }
          if ($text -notmatch 'Icon cache refreshed') { Write-Host "::warning title=Installer::icon cache refresh not in log" }
          Add-Type -AssemblyName System.Drawing
          $a = ([System.Drawing.Icon]::ExtractAssociatedIcon($exe)).ToBitmap()
          $b = (New-Object System.Drawing.Icon($ico, 32, 32)).ToBitmap()
          $diff = 0
          for ($y = 0; $y -lt 32; $y++) { for ($x = 0; $x -lt 32; $x++) { if ($a.GetPixel($x, $y).ToArgb() -ne $b.GetPixel($x, $y).ToArgb()) { $diff++ } } }
          if ($diff -gt 40) { Write-Host "::error title=Installer::installed MotiNook.exe icon differs from GifPin.ico ($diff px)"; exit 1 }
          $size = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "::notice title=Installer::installer $size MB · runtime check ok · installed app started in Korean · shortcuts use the new icon · .gifpin packs open with GifPin"

      - uses: actions/upload-artifact@v4
        with:
          name: MotiNook-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MotiNook ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            - `MotiNook-Setup-${{ steps.ver.outputs.version }}.exe` — 설치 프로그램 (작은 용량). PC에 .NET 8 데스크톱 런타임이 없으면 설치 중에 Microsoft에서 내려받아 자동으로 설치합니다 (이때만 Windows 권한 확인).
            - `MotiNook-portable-${{ steps.ver.outputs.version }}.exe` — 설치 없이 바로 실행 (.NET 런타임 포함, 용량 큼)
          files: dist/*.exe
